<div id="variable-manager-container">
  <div class="variable-nav-container">
    <div id="global-tab" class="tab-item active"><div class="tab-item-text">Global Variables</div></div>
    <div id="character-tab" class="tab-item"><div class="tab-item-text">Character Variables</div></div>
    <div id="chat-tab" class="tab-item"><div class="tab-item-text">Chat Variables</div></div>
    <div id="message-tab" class="tab-item"><div class="tab-item-text">Message Variables</div></div>
  </div>
  <div class="flex-container" style="margin: 1px; justify-content: space-between">
    <div class="left-controls">
      <div id="filter-icon" class="filter-icon" title="Filter by variable type">
        <i class="fa-solid fa-filter"></i>
      </div>
      <div class="search-container">
        <input type="text" id="variable-search" class="variable-search" placeholder="Search variables..." aria-label="Search variables" />
      </div>
    </div>
    <div class="right-controls">
      <div id="add-variable" class="menu_button_icon menu_button interactable" title="Add new variable (Ctrl+N)">
        <i class="fa-solid fa-plus"></i>
        <span>New</span>
      </div>
      <div id="clear-all" class="menu_button_icon menu_button interactable" title="Clear all variables (Ctrl+Shift+D)">
        <i class="fa-solid fa-trash"></i>
        <span>Clear</span>
      </div>
    </div>
  </div>
  <div id="filter-options" class="filter-options" style="display: none">
    <div class="filter-option">
      <input type="checkbox" id="filter-string" class="filter-checkbox" data-type="string" checked aria-label="Filter string variables" />
      <label for="filter-string">String</label>
    </div>
    <div class="filter-option">
      <input type="checkbox" id="filter-object" class="filter-checkbox" data-type="object" checked aria-label="Filter object variables" />
      <label for="filter-object">Object</label>
    </div>
    <div class="filter-option">
      <input type="checkbox" id="filter-array" class="filter-checkbox" data-type="array" checked aria-label="Filter array variables" />
      <label for="filter-array">Array</label>
    </div>
    <div class="filter-option">
      <input type="checkbox" id="filter-number" class="filter-checkbox" data-type="number" checked aria-label="Filter number variables" />
      <label for="filter-number">Number</label>
    </div>
    <div class="filter-option">
      <input type="checkbox" id="filter-boolean" class="filter-checkbox" data-type="boolean" checked aria-label="Filter boolean variables" />
      <label for="filter-boolean">Boolean</label>
    </div>
  </div>

  <div id="floor-filter-container" class="floor-filter-container" style="display: none">
    <div class="floor-filter-content">
      <div class="floor-range-inputs">
        <div class="floor-input-group">
          <input type="number" id="floor-min" class="floor-input" min="0" placeholder="Min" aria-label="Minimum floor" /> floor
          <span class="floor-separator">~</span>
          <input type="number" id="floor-max" class="floor-input" min="0" placeholder="Max" aria-label="Maximum floor" /> floor
        </div>
        <button id="floor-filter-btn" class="floor-filter-btn">
          <i class="fa-solid fa-check"></i>
          <span>Confirm</span>
        </button>
      </div>
      <div id="floor-filter-error" class="floor-filter-error" style="display: none">Maximum floor cannot be less than minimum floor</div>
    </div>
  </div>

  <div class="tab-content-container">
    <div id="global-content" class="tab-content active">
      <div class="variable-list"></div>
    </div>
    <div id="character-content" class="tab-content">
      <div class="variable-list"></div>
    </div>
    <div id="chat-content" class="tab-content">
      <div class="variable-list"></div>
    </div>
    <div id="message-content" class="tab-content">
      <div class="variable-list"></div>
    </div>
  </div>
</div>
