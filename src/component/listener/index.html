  <div class="divider"></div>
  <div class="iframe_update_listener">

          >

      </div>
      <div class="menu_button menu_button_icon interactable">
        <a
          href="https://discord.com/channels/1134557553011998840/1320081111451439166/1354125905848569958"

    </div>
    <div class="flex-container flexFlowColumn">
      <div class="flex flexFlowColumn">

      <div class="flex flexFlowColumn">
        <b class="table_setting_category_header">Refresh Interval (milliseconds)</b>
